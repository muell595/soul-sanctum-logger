<form class="npc-chat-form">

<!-- Title -->
  <h2 class="npc-title">{{npcName}}</h2>

<!-- History -->
  <div id="npc-history" class="npc-history">
    {{#each messages}}
      <div class="message"><strong>{{speaker}}:</strong> {{{content}}}</div>
    {{/each}}
  </div>

  <!-- Row Input -->
  <div class="npc-input-row">
    <input type="text"
           id="npc-input"
           placeholder="Type a message…"
           autocomplete="off" />
    <button type="button"
            id="npc-send"
            class="btn">Send</button>
  </div>

</form>

<style>
  
  .npc-chat .window-content {
    background: #fafafa;
    color: #222;
    padding: 0.5rem;
  }

  
  .npc-chat .npc-title {
    margin: 0 0 0.5rem 0;
    font-size: 1.2rem;
    text-align: center;
  }


  .npc-chat .npc-history {
    max-height: 260px;               
    overflow-y: auto;
    padding: 0.5rem;
    background: rgba(255,255,255,0.9);
    border: 1px solid #bbb;
    border-radius: 4px;
    margin-bottom: 0.5rem;
  }

  .npc-chat .npc-history .message {
    margin-bottom: 0.35rem;
  }

  /* Input row – flex layout for input + button */
  .npc-chat .npc-input-row {
    display: flex;
    gap: 0.5rem;
  }

  .npc-chat #npc-input {
    flex: 1;
    padding: 0.3rem 0.4rem;
    border: 1px solid #aaa;
    border-radius: 3px;
  }

  .npc-chat #npc-send {
    flex: 0 0 auto;
    padding: 0.3rem 0.8rem;
    background: #2d9cdb;            /* a pleasant blue */
    color: #fff;
    border: none;
    border-radius: 3px;
    cursor: pointer;
  }

  .npc-chat #npc-send:hover {
    background: #1b7bb8;
  }
</style>
